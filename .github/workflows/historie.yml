name: Gunningen historie (spreadsheet)

on:
  workflow_dispatch:
    inputs:
      van:
        description: "Begin periode, dagen geleden (548 = 1,5 jaar)"
        default: "548"
      tot:
        description: "Eind periode, dagen geleden (183 = half jaar)"
        default: "183"
      alles:
        description: "Ook gunningen met lage relevantiescore meenemen (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: gunningenradar-historie
  cancel-in-progress: false

jobs:
  historie:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Modules installeren
        run: pip install requests pypdf openpyxl

      - name: Gunningen ophalen en spreadsheet maken
        env:
          TENDERNED_API_USERNAME: ${{ secrets.TENDERNED_API_USERNAME }}
          TENDERNED_API_PASSWORD: ${{ secrets.TENDERNED_API_PASSWORD }}
        run: |
          EXTRA=""
          if [ "${{ inputs.alles }}" = "true" ]; then EXTRA="--alles"; fi
          python tenderned_gunningen.py --van ${{ inputs.van }} --tot ${{ inputs.tot }} \
            --max-verrijking 5000 --xlsx exports/gunningen-historie.xlsx $EXTRA

      # Eerst als download bewaren, zodat het resultaat nooit verloren gaat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gunningen-historie
          path: |
            exports/
            winnaars-cache.json
          if-no-files-found: warn

      # Daarna in de repo zetten. Botst dat met de dagelijkse radar,
      # dan worden beide caches samengevoegd in plaats van te falen.
      - name: Spreadsheet en cache bewaren
        if: always()
        run: |
          git config user.name "gunningenradar"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/hist
          cp -r exports /tmp/hist/ 2>/dev/null || true
          cp winnaars-cache.json /tmp/hist/ 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          mkdir -p exports
          cp -r /tmp/hist/exports/. exports/ 2>/dev/null || true
          python - << 'PY'
          import json, os
          def lees(p):
              try:
                  return json.load(open(p, encoding="utf-8"))
              except Exception:
                  return {}
          ons = lees("/tmp/hist/winnaars-cache.json")
          hun = lees("winnaars-cache.json")
          for k, v in ons.items():
              h = hun.get(k)
              if not h or (v.get("winnaars") and not h.get("winnaars")) \
                      or v.get("pogingen", 0) > h.get("pogingen", 0):
                  hun[k] = v
          json.dump(hun, open("winnaars-cache.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1)
          PY
          git add exports/ winnaars-cache.json
          git commit -m "Historie bijgewerkt $(date +%F)" || echo "Niets nieuws"
          git push
