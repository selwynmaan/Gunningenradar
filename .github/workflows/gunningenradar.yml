name: Gunningenradar bijwerken

on:
  schedule:
    - cron: "15 5 * * *"   # dagelijks 05:15 UTC = 07:15 NL (zomertijd)
  workflow_dispatch:        # knop "Run workflow" om handmatig te draaien

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gunningenradar
  cancel-in-progress: true

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Modules installeren
        run: pip install requests pypdf

      - name: Radar draaien
        env:
          TENDERNED_API_USERNAME: ${{ secrets.TENDERNED_API_USERNAME }}
          TENDERNED_API_PASSWORD: ${{ secrets.TENDERNED_API_PASSWORD }}
        run: python tenderned_gunningen.py

      - name: Website klaarzetten
        run: |
          mkdir -p site
          cp gunningen-radar.html site/index.html
          cp gunningen.csv site/gunningen.csv

      - name: Cache en "gezien" bewaren voor de volgende run
        run: |
          git config user.name "gunningenradar"
          git config user.email "actions@users.noreply.github.com"
          git add winnaars-cache.json gezien-gunningen.json
          git commit -m "Radar bijgewerkt $(date +%F)" || echo "Niets nieuws te bewaren"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
